name: panel-dev
x-app: &app
  image: remnadrop:dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  env_file: backend/.env.dev
  environment: &environment
    DATABASE_URL: postgresql://panel:${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD}@db:5432/panel
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_SOCKET: ''
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD}
      POSTGRES_DB: panel
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U panel -d panel']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: valkey/valkey:8.1-alpine
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: [sh, -c, 'npm run migrate:deploy && npm run migrate:seed']
  api:
    <<: *app
    environment:
      <<: *environment
      INSTANCE_TYPE: api
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *app
    environment:
      <<: *environment
      INSTANCE_TYPE: processor
    command: [node, dist/src/bin/processors/processors.js]
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    <<: *app
    environment:
      <<: *environment
      INSTANCE_TYPE: scheduler
    command: [node, dist/src/bin/scheduler/scheduler.js]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  database:
