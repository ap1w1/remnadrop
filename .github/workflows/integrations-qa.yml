name: Integrations QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile.dev'
      - 'integrations/**'
      - 'tests/**'
      - 'scripts/compose-files.py'
      - 'scripts/patch-limiter.py'
      - 'scripts/fetch-editor-assets.mjs'
      - 'editor-assets.lock.json'
      - 'migrate-2.8.1.sh'
      - 'upgrade-fork.sh'
      - '.github/workflows/integrations-qa.yml'
  workflow_dispatch:

concurrency:
  group: integr-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, upgrade and integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24 for runtime regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deployment and Limiter runtime regression tests
        run: |
          bash -n scripts/remnadrop-cli.sh
          bash tests/remnadrop-source-sync.sh
          sudo python3 -m unittest discover -s tests -v
          node --test tests/limiter-runtime.cjs
      - name: Build application image
        id: image
        run: |
          docker build --progress=plain -f Dockerfile.dev -t remnadrop-integrations-qa .
      - name: Check features packaged in the final image
        id: package
        run: |
          docker run --rm --network none --entrypoint sh remnadrop-integrations-qa -ec '
            test -s /app/prisma/migrations/20261122000100_integrations_limiter_cloudflare/migration.sql
            test -s /app/prisma/migrations/20261122220000_limiter_events/migration.sql
            test -s /app/prisma/migrations/20261122221000_cloudflare_accounts/migration.sql
            test -s /app/prisma/migrations/20261122222000_automation_workflows/migration.sql
            test -s /app/prisma/migrations/20261123120000_panel_events_ssl/migration.sql
            test -s /app/prisma/migrations/20261124000000_event_login_remove_push/migration.sql
            test -f /app/frontend/index.html
            test -s /app/frontend/assets/wasm_exec.js
            test -s /app/frontend/assets/main.wasm
            test -s /app/frontend/assets/xray.schema.json
            test -s /app/frontend/assets/xray.schema.cn.json
            test -x /usr/local/bin/remnawave-limiter
            test -s /etc/ssl/certs/ca-certificates.crt
            grep -RqlF "/dashboard/tools/limiter" /app/frontend
            grep -RqlF "/dashboard/tools/cloudflare-dns" /app/frontend
          '
      - name: Integration, authorization and workflow regression tests
        run: |
          docker run --rm --network none \
            -v "$PWD/tests/integrations:/checks:ro" \
            --entrypoint sh remnadrop-integrations-qa -ec 'node --test /checks/*.test.cjs'
      - name: Upgrade test database and check application API
        if: ${{ always() && !cancelled() && steps.package.outcome == 'success' }}
        run: |
          bash tests/integrations/database-smoke.sh remnadrop-integrations-qa
      - name: Panel inbox, login and SSL regression tests
        run: |
          docker run --rm --network none --entrypoint sh remnadrop-integrations-qa -ec 'node --test scripts/panel-events.test.cjs scripts/reality-key.test.cjs scripts/node-quota-usage.test.cjs scripts/node-quota-accounting.test.cjs'
      - name: Agent unit tests
        run: |
          python3 -m unittest discover -s backup-agent -p 'test*.py' -v
      - name: Render production UI and exercise desktop and mobile workflows
        id: ui
        if: ${{ always() && !cancelled() && steps.package.outcome == 'success' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/remnadrop-ui-qa" --no-save playwright@1.57.0
          "$RUNNER_TEMP/remnadrop-ui-qa/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p artifacts/frontend artifacts/ui
          container=$(docker create remnadrop-integrations-qa)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/app/frontend/." artifacts/frontend/
          REMNADROP_PLAYWRIGHT_MODULE="$RUNNER_TEMP/remnadrop-ui-qa/node_modules/playwright/index.mjs" \
            node tests/integrations/ui-smoke.mjs
      - name: Upload UI screenshots and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-ui-proof
          path: artifacts/ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload production UI bundle after a browser failure
        if: ${{ always() && !cancelled() && steps.ui.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-ui-bundle
          path: artifacts/frontend/
          if-no-files-found: ignore
          retention-days: 1

